
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dairyguard-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dairyguard-frontend
  template:
    metadata:
      labels:
        app: dairyguard-frontend
    spec:
      containers:
        - name: frontend
          image: dairyguard-ai-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: dairyguard-frontend
spec:
  selector:
    app: dairyguard-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
  type: NodePort
